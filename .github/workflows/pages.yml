name: Build & deploy

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Installomator (history, no blobs, for added/updated dates)
        uses: actions/checkout@v4
        with:
          repository: Installomator/Installomator
          path: installomator
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build labels.json
        run: node scripts/build-labels.mjs installomator data/labels.json

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r index.html app.js parse.js assets _site/
          cp data/labels.json _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
